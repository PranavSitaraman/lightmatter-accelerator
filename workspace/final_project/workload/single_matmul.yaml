workload:
  rank_sizes:
    M: {{ M | default(1) }}
    K: {{ K | default(4096) }}
    N: {{ N | default(4096) }}

  bits_per_value: {All: {{ BITS_PER_VALUE | default(8) }}}
  einsums:
  - name: Matmul
    tensor_accesses:
    - {name: Activations, projection: [m, k]}
    - {name: Weights, projection: [k, n]}
    - {name: Outputs, projection: [m, n], output: True}
    renames: {input: Activations, weight: Weights, output: Outputs}
