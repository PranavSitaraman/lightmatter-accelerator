##############################################################################
# Passage EVK100 — Flat-cost optical interconnect model
#
# Key idea: optical crossbar = distance-independent cost.
#   - !Network hops energy = 0  (no per-hop penalty)
#   - PassageTransceiver !Memory = flat 1.9 pJ/bit per access
#
# This correctly models an optical crossbar where every node-to-node
# transfer pays the same transceiver energy regardless of physical
# distance (wavelength routing / OCS, single-hop fabric).
#
# Supports both 2D (NODES_Z=1) and 3D topologies via Jinja variables.
#
# Passage EVK100 specs (ISES Korea 2025):
#   - 3.2 Tbps per fiber (16-lambda, 112G PAM4)
#   - 1.9 pJ/bit total wall-plug energy
#   - Monolithic PIC: MRM modulators, TIAs, Tx drivers
##############################################################################

{% set NODES_X = NODES_X | default(4) %}
{% set NODES_Y = NODES_Y | default(4) %}
{% set NODES_Z = NODES_Z | default(1) %}
{% set PE_X = PE_X | default(64) %}
{% set PE_Y = PE_Y | default(64) %}
{% set HBM_GIB = HBM_GIB | default(8) %}
{% set UB_MIB = UB_MIB | default(128) %}

# Passage EVK100 transceiver: flat per-bit cost (distance-independent)
{% set PASSAGE_ENERGY_PER_BIT = PASSAGE_ENERGY_PER_BIT | default(1.9e-12) %}
{% set PASSAGE_LATENCY_PER_BIT = PASSAGE_LATENCY_PER_BIT | default(1 / (8 * 3200e9)) %}

arch:
  nodes:
  # ── Level 0: Shared off-chip memory (pooled across all nodes) ──────────
  - !Memory
    name: MainMemory
    size: {{ NODES_X * NODES_Y * NODES_Z * HBM_GIB * 1024 * 1024 * 1024 * 8 }}
    area: 0
    leak_power: 0
    total_latency: max(read_latency, write_latency)
    tensors: {keep: All}
    actions:
    - {name: read, energy: 7.03e-12, latency: 1 / (8 * 1200e9)}
    - {name: write, energy: 7.03e-12, latency: 1 / (8 * 1200e9)}

  # ── Level 1: Passage optical network — zero per-hop cost ───────────────
  # The optical fabric itself adds no distance-dependent energy.
  # All interconnect cost comes from the transceiver below.
  - !Network
    name: PassageOpticalFabric
    area: 0
    leak_power: 0
    actions:
    - {name: hops, energy: 0, latency: 0}

  # ── Level 2: Passage optical transceiver — flat per-bit cost ───────────
  # This memory-like element models the Tx/Rx transceiver energy.
  # Every bit crossing the optical fabric pays this fixed cost,
  # regardless of how many hops the Network would have counted.
  # Spatially distributed: each node has its own transceiver.
  - !Memory
    name: PassageTransceiver
    size: inf
    area: 0
    leak_power: 0
    total_latency: max(read_latency, write_latency)
    tensors: {keep: ~MainMemory, may_keep: All}
    actions:
    - {name: read, energy: {{ PASSAGE_ENERGY_PER_BIT }}, latency: {{ PASSAGE_LATENCY_PER_BIT }}}
    - {name: write, energy: {{ PASSAGE_ENERGY_PER_BIT }}, latency: {{ PASSAGE_LATENCY_PER_BIT }}}
    spatial:
    - {name: X, fanout: {{ NODES_X }}}
    - {name: Y, fanout: {{ NODES_Y }}}
{% if NODES_Z > 1 %}
    - {name: Z, fanout: {{ NODES_Z }}}
{% endif %}

  # ── Level 3: Per-node HBM ─────────────────────────────────────────────
  - !Memory
    name: HBM
    size: {{ HBM_GIB * 1024 * 1024 * 1024 * 8 }}
    area: 0
    leak_power: 0
    total_latency: max(read_latency, write_latency)
    tensors: {keep: All}
    actions:
    - {name: read, energy: 7.03e-12, latency: 1 / (8 * 1200e9)}
    - {name: write, energy: 7.03e-12, latency: 1 / (8 * 1200e9)}

  # ── Level 4: Per-node unified buffer ───────────────────────────────────
  - !Memory
    name: UnifiedBuffer
    size: {{ UB_MIB * 1024 * 1024 * 8 }}
    area: 112e-6
    leak_power: 0
    total_latency: max(read_latency, write_latency)
    tensors: {keep: All}
    actions:
    - {name: read, energy: 1.88e-12, latency: 1 / (8 * 2048e9)}
    - {name: write, energy: 2.36e-12, latency: 1 / (8 * 1024e9)}

  # ── Level 5: PE array with input/output reuse trees ────────────────────
  - !Container
    name: ProcessingElement
    spatial:
    - {name: reuse_input, fanout: {{ PE_X }}, may_reuse: input, reuse: input, min_usage: 1}
    - {name: reuse_output, fanout: {{ PE_Y }}, may_reuse: output, reuse: output, min_usage: 1}

  # ── Level 6: Weight register ───────────────────────────────────────────
  - !Memory
    name: Register
    size: weight.bits_per_value if weight else 0
    area: 1e-11
    leak_power: 0
    tensors: {keep: weight}
    actions:
    - {name: read, energy: 0, latency: 0}
    - {name: write, energy: 0, latency: 0}

  # ── Level 7: MAC unit ──────────────────────────────────────────────────
  - !Compute
    name: MAC
    area: 9e-11
    leak_power: 0
    actions:
    - {name: compute, energy: 0.084e-12, latency: 1 / 1.05e9}
